name: Backup

# Solo cron semanal y disparo manual — nunca pull_request ni push. No tiene
# sentido correr un backup de producción en cada PR, y evita que corra sin
# querer. Ver docs/BACKUP_RESTORE.md y docs/DECISIONS.md (2026-10-06).
on:
  schedule:
    - cron: "0 6 * * 1" # lunes 6:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Los 3 secrets viven en este Environment (restringido a la rama main),
    # no como repo secret — los carga Jose directo ahí, nunca pasan por
    # Claude Code. Ver docs/BACKUP_RESTORE.md.
    environment: production-backup
    steps:
      # Todas las actions de terceros (no las de GitHub mismo) fijadas por SHA
      # de commit, no por tag — pedido explícito de Jose (2026-10-06).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (para el script de Storage)
        run: npm ci

      # pg_dump vía Docker con la imagen oficial de Postgres 17 (misma versión
      # del proyecto real) en vez del pg_dump de apt en ubuntu-latest, que
      # puede quedar desfasado de versión y fallar al dumpear un Postgres más
      # nuevo. Formato plano (no -Fc) a propósito: se puede inspeccionar con
      # grep y restaurar con psql sin pg_restore.
      - name: Dump de la base (incluye auth.users — no solo public)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -v "$PWD:/backup" postgres:17 \
            pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -f /backup/db.sql
          grep -q "INSERT INTO auth.users" db.sql || grep -q "COPY auth.users" db.sql \
            || { echo "::error::el dump no incluye auth.users"; exit 1; }

      # service_role key: salta TODO el RLS (ver docs/BACKUP_RESTORE.md) — es
      # la única forma de bajar los archivos de Storage, que quedan fuera del
      # alcance de pg_dump (son blobs, no filas de Postgres).
      - name: Descargar archivos de Storage (bucket clinical-files)
        env:
          SUPABASE_URL: https://pvuaqatdendcgumwktid.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-storage.mjs ./storage

      - name: Empaquetar y cifrar
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          tar -cf backup.tar db.sql storage/
          gpg --batch --yes --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.tar.gpg backup.tar
          rm -f backup.tar db.sql
          rm -rf storage

      # El repo es público: los artifacts de Actions de un repo público los
      # puede bajar cualquier usuario de GitHub logueado. El cifrado de arriba
      # es obligatorio por eso, no opcional.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-${{ github.run_id }}
          path: backup.tar.gpg
          retention-days: 90
