name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Valores públicos por diseño (viajan en el bundle del cliente).
  # Cualquier secreto real va en GitHub Secrets, nunca acá.
  VITE_SUPABASE_PROJECT_ID: pvuaqatdendcgumwktid
  VITE_SUPABASE_URL: https://pvuaqatdendcgumwktid.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dWFxYXRkZW5kY2d1bXdrdGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODI1NDksImV4cCI6MjA5MDc1ODU0OX0.lXARzBHFr25LgypLiGivFC49FO4Yy6FdZiH4JMSl9lI

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo dependencias de producción (las que van al bundle) y solo
      # alto/crítico: las de devDependencies (vite/vitest, herramientas de
      # build/test que no se despliegan) quedan afuera a propósito — ver
      # docs/AUDIT_2026-10-02.md y docs/TASKS.md para las ya triagueadas que
      # necesitan un bump mayor. Si esto empieza a fallar, es una
      # vulnerabilidad nueva en código que sí llega al navegador.
      - name: Audit de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Scan de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Techo de warnings: la deuda actual son 239 (200 son no-explicit-any).
      # Si bajás warnings, bajá el número acá para que no vuelvan a subir.
      - name: Lint
        run: npx eslint . --max-warnings 239

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
