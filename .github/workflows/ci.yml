name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Antes acá vivían VITE_SUPABASE_PROJECT_ID/URL/PUBLISHABLE_KEY de
  # PRODUCCIÓN — ningún job de este workflow los necesita más: los tests
  # corren contra el Supabase LOCAL que cada job levanta con `supabase
  # start` (ver steps de abajo), y `npm run build` nunca ejecuta ese código,
  # solo lo empaqueta (un string vacío compila igual). El build real para
  # Vercel usa las env vars que Vercel tiene configuradas, no las de acá.
  #
  # Passwords de los usuarios de prueba de RLS (rls-test-a/b@example.com) —
  # siguen siendo secretas: ya no identifican cuentas que existen de
  # antemano en ningún lado, son la password con la que cada job CREA esas
  # cuentas en su propio Supabase local (ver scripts/ci/seed-local-test-users.mjs).
  RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
  RLS_TEST_USER_B_PASSWORD: ${{ secrets.RLS_TEST_USER_B_PASSWORD }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action necesita resolver el rango de commits del PR
          # (base^..head) para diffear solo lo nuevo — con el shallow clone
          # por defecto (fetch-depth: 1) esos commits no están disponibles
          # localmente y el scan falla con "unknown revision". fetch-depth
          # 0 (historial completo) es lo que arregla esto; gitleaks igual
          # sigue escaneando solo el rango del PR, no reescanea todo el
          # historial en cada corrida — eso lo controla el --log-opts que
          # ya arma la action sola, no esto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo dependencias de producción (las que van al bundle): las de
      # devDependencies (vite/vitest, herramientas de build/test que no se
      # despliegan) quedan afuera a propósito.
      # Umbral en "critical" (no "high"): react-router (moderate, conocida
      # desde docs/AUDIT_2026-10-02.md) y zod (high, GHSA-mrhx-c7xc-m3w5,
      # fix exige breaking change 3→4, ver docs/TASKS.md) quedan aceptadas a
      # propósito — bajarlo a "high" las vuelve a romper sin que haya nada
      # nuevo que arreglar. Si esto empieza a fallar, es una vulnerabilidad
      # crítica nueva en código que sí llega al navegador.
      - name: Audit de dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

      - name: Scan de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Techo de warnings: la deuda actual son 239 (200 son no-explicit-any).
      # Si bajás warnings, bajá el número acá para que no vuelvan a subir.
      - name: Lint
        run: npx eslint . --max-warnings 239

      # `tsconfig.json` es "solution-style" (`files: []` + `references` a
      # tsconfig.app.json/tsconfig.node.json, el default del template de
      # Vite). `tsc --noEmit` sin `--build` IGNORA `references` y usa
      # `files`/`include` del config raíz — acá eso es `files: []`, así que
      # compilaba 0 archivos y pasaba siempre, sin chequear nada. Estuvo así
      # desde que se agregó este workflow (2026-07-16) hasta que se encontró
      # el 2026-10-03 (ver docs/PROJECT_STATE.md). `tsc --build` sí sigue
      # las references — compila tsconfig.app.json (src/) y
      # tsconfig.node.json (vite.config.ts) de verdad, cada uno con su
      # propio `noEmit: true` ya seteado.
      - name: Typecheck
        run: npx tsc --build

      # CLI oficial, acción de Supabase (no fija versión exacta: ci.yml
      # tampoco fija la de Node a nivel patch, mismo criterio). Va acá y no
      # más arriba: si Audit/Lint/Typecheck ya fallaron, no tiene sentido
      # esperar a que levante Docker para nada.
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Levanta Postgres+Auth+Storage local con el baseline del repo
      # (supabase/migrations/) — es el mismo stack que ya se confirmó que
      # levanta limpio desde cero (ver docs/PROJECT_STATE.md, 2026-10-11).
      # A partir de acá, rls.test.ts ya NO le pega a producción.
      - name: Levantar Supabase local
        run: supabase start

      # `supabase status -o env` imprime las credenciales de ESTE stack local
      # (URL/keys cambian en cada corrida) en formato dotenv — API_URL,
      # ANON_KEY, DB_URL (nombres confirmados contra la corrida real, no
      # `--override-name`: esa flag espera un nombre de origen tipo "api.url"
      # según su propio --help, no "API_URL" como muestran algunos ejemplos
      # de la doc — para no depender de adivinar bien ese formato, el
      # archivo se sourcea tal cual y se reexporta con los nombres que
      # espera el resto del repo).
      - name: Exportar credenciales del Supabase local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          source /tmp/supabase-status.env
          set +a
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # Crea rls-test-a/b@example.com en ESTE Supabase local (no existen de
      # antemano en una base recién levantada) — ver el comentario del
      # propio script para el porqué del INSERT directo en vez de
      # signUp/inviteUserByEmail.
      - name: Seed de usuarios de prueba (Supabase local)
        run: node scripts/ci/seed-local-test-users.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Piloto de e2e (docs/AUDIT_2026-10-02.md, "endurecer CI + sumar tests",
  # PR #43). Corre contra Supabase LOCAL propio de este job (ver steps de
  # abajo) desde este PR — antes pegaba contra producción. Sigue NO
  # bloqueante por ahora (no está en required_status_checks de main, ver
  # DECISIONS.md): el cambio de entorno es nuevo y conviene verlo estable
  # en corridas reales antes de sumarle además la presión de ser bloqueante
  # — ver docs/TASKS.md para el criterio exacto de cuándo promoverlo.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Levantar Supabase local
        run: supabase start

      - name: Exportar credenciales del Supabase local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          source /tmp/supabase-status.env
          set +a
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # Solo rls-test-a (ver e2e/supabaseTestClient.ts) — ningún spec usa B.
      - name: Seed de usuarios de prueba (Supabase local)
        run: node scripts/ci/seed-local-test-users.mjs

      - name: Instalar Playwright (solo Chromium, único browser del config)
        run: npx playwright install --with-deps chromium

      # El `webServer` de playwright.config.ts (`npm run dev`) hereda estas
      # env vars del job — el dev server que Playwright maneja sirve el
      # bundle ya apuntando al Supabase local, no a producción.
      - name: E2E
        run: npm run test:e2e
