name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Valores públicos por diseño (viajan en el bundle del cliente).
  # Cualquier secreto real va en GitHub Secrets, nunca acá.
  VITE_SUPABASE_PROJECT_ID: pvuaqatdendcgumwktid
  VITE_SUPABASE_URL: https://pvuaqatdendcgumwktid.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dWFxYXRkZW5kY2d1bXdrdGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODI1NDksImV4cCI6MjA5MDc1ODU0OX0.lXARzBHFr25LgypLiGivFC49FO4Yy6FdZiH4JMSl9lI
  # Password del usuario de prueba de RLS que usa e2e/supabaseTestClient.ts
  # — esta sí es secreta (ver docs/DECISIONS.md 2026-10-06, PR #51). Esta
  # línea se duplica temporalmente acá porque el PR #51 todavía no mergeó a
  # main — al rebasear este branch después de ese merge, la duplicación
  # desaparece sola.
  RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action necesita resolver el rango de commits del PR
          # (base^..head) para diffear solo lo nuevo — con el shallow clone
          # por defecto (fetch-depth: 1) esos commits no están disponibles
          # localmente y el scan falla con "unknown revision". fetch-depth
          # 0 (historial completo) es lo que arregla esto; gitleaks igual
          # sigue escaneando solo el rango del PR, no reescanea todo el
          # historial en cada corrida — eso lo controla el --log-opts que
          # ya arma la action sola, no esto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo dependencias de producción (las que van al bundle) y solo
      # alto/crítico: las de devDependencies (vite/vitest, herramientas de
      # build/test que no se despliegan) quedan afuera a propósito — ver
      # docs/AUDIT_2026-10-02.md y docs/TASKS.md para las ya triagueadas que
      # necesitan un bump mayor. Si esto empieza a fallar, es una
      # vulnerabilidad nueva en código que sí llega al navegador.
      - name: Audit de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Scan de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Techo de warnings: la deuda actual son 239 (200 son no-explicit-any).
      # Si bajás warnings, bajá el número acá para que no vuelvan a subir.
      - name: Lint
        run: npx eslint . --max-warnings 239

      # `tsconfig.json` es "solution-style" (`files: []` + `references` a
      # tsconfig.app.json/tsconfig.node.json, el default del template de
      # Vite). `tsc --noEmit` sin `--build` IGNORA `references` y usa
      # `files`/`include` del config raíz — acá eso es `files: []`, así que
      # compilaba 0 archivos y pasaba siempre, sin chequear nada. Estuvo así
      # desde que se agregó este workflow (2026-07-16) hasta que se encontró
      # el 2026-10-03 (ver docs/PROJECT_STATE.md). `tsc --build` sí sigue
      # las references — compila tsconfig.app.json (src/) y
      # tsconfig.node.json (vite.config.ts) de verdad, cada uno con su
      # propio `noEmit: true` ya seteado.
      - name: Typecheck
        run: npx tsc --build

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Piloto de e2e (docs/AUDIT_2026-10-02.md, "endurecer CI + sumar tests",
  # PR #43). Corre contra Supabase real (mismo usuario de prueba que
  # src/test/rls.test.ts) con el patrón "crear solo si no existe" + cleanup
  # en afterAll — no debería acumular datos de prueba, pero por eso este job
  # es NO bloqueante todavía: no está en required_status_checks de main (ver
  # DECISIONS.md). Se promueve a bloqueante en una sesión futura una vez se
  # vea estable en corridas reales.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    # El spec de paciente+sesión usa un DNI fijo (90000001) reusado entre
    # corridas — dos corridas concurrentes (dos PRs activos a la vez)
    # podrían pisarse al crear el paciente o al limpiar la sesión de prueba
    # equivocada. Este group serializa solo las corridas de e2e entre sí,
    # sin frenar el resto de los jobs/PRs.
    concurrency:
      group: e2e-supabase-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Playwright (solo Chromium, único browser del config)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
