name: Deploy

# Solo push a main (después de un squash merge) — nunca pull_request. Esto
# es lo que corre DESPUÉS de que un PR ya pasó `ci` y se mergeó, no un check
# de PR. Mismo proyecto de Vercel para staging y prod (--prod cambia el
# target); dos proyectos de Supabase (rehabot-staging / producción real).
on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────── STAGING ───────────────────────────
  # Mismo flujo que la producción de abajo, pero contra rehabot-staging
  # (proyecto de Supabase separado, ver docs/DECISIONS.md) — automático,
  # sin aprobación: es la QA que confirma que el commit anda ANTES de
  # pedirle a Jose que apruebe el deploy real.

  deploy-db-staging:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      # --db-url conecta directo (session pooler) sin necesitar `supabase
      # link`/access token — mismo secret que usa Jose para cargar, nada
      # nuevo que aprender respecto a como ya funciona backup.yml.
      - name: Aplicar migraciones a staging
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  deploy-front-staging:
    needs: deploy-db-staging
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # VITE_SUPABASE_URL/PUBLISHABLE_KEY de rehabot-staging — públicos por
    # diseño (anon key), igual que los de producción más abajo. Se bakean acá
    # porque Vite los reemplaza en el bundle AL BUILDEAR, no en runtime — ver
    # docs/DECISIONS.md para el porqué de buildear dos veces el mismo commit
    # en vez de promover un solo artefacto.
    env:
      VITE_SUPABASE_URL: https://omigkfhiszbfbymbzaxr.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9taWdrZmhpc3piZmJ5bWJ6YXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDA2MTksImV4cCI6MjEwODc3NjYxOX0.QNQvDZKe0KCH1rJcMVv3ijHYN54r4KwxA39CpxjvCc8 # gitleaks:allow — anon key pública, no un secreto real (ver e2e/supabaseTestClient.ts)
      # Sin estas dos, `vercel alias set` falló con "User not found" en la
      # corrida real: sin contexto de team explícito, resuelve el scope del
      # token contra la cuenta personal en vez del team donde vive el
      # proyecto. `pull`/`build`/`deploy` no lo necesitaban (usan
      # .vercel/project.json), pero `alias` sí — se ponen acá, a nivel job,
      # para que TODOS los comandos de este job compartan el mismo scope sin
      # tener que acordarse de repetirlo paso por paso.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `vercel build` necesita Project Settings reales (framework, build
      # command, etc.), no alcanza con un project.json armado a mano con
      # solo los IDs ("[BUILD_PROJECT_SETTINGS_REQUIRED]", confirmado en la
      # corrida real) — `vercel pull` es la única forma de conseguirlos sin
      # interacción. Esto SÍ trae las env vars que Vercel tenga guardadas
      # para el target "preview" a `.vercel/.env.preview.local`, pero ya no
      # es un problema: Jose las dejó apuntando a rehabot-staging, mismo
      # valor que las VITE_* de ESTE job — no hay ambigüedad real, process.env
      # (seteado acá arriba) tiene precedencia sobre lo que haya en ese
      # archivo de todos modos.
      - name: Traer la config del proyecto de Vercel (vercel pull)
        run: npx vercel@latest pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (con las VITE_* de staging de este job)
        run: npx vercel@latest build --token="${{ secrets.VERCEL_TOKEN }}"

      # Deploy "suelto": crea la deployment pero no le asigna ningún dominio
      # todavía — el output es la URL única de esta deployment puntual.
      - name: Deploy del build a Vercel
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Alias fijo: así smoke-staging/tests-staging (y Jose a mano) siempre
      # entran por la misma URL, sin tener que buscar cuál fue la última
      # deployment. Si "proyec-to-staging.vercel.app" ya está tomado por
      # otra cuenta de Vercel (es un namespace global de *.vercel.app),
      # este step falla y hay que elegir otro subdominio — avisar a Jose.
      #
      # `alias set` espera el deployment como HOSTNAME puro, sin el esquema.
      #
      # "Error: User not found" que vimos acá en corridas anteriores no era
      # por el formato del hostname ni por --scope: era porque el
      # VERCEL_TOKEN de ese momento tenía scope a un team/proyecto distinto
      # del de la cuenta (confirmado comparando el scope del token contra
      # los demás tokens en vercel.com/account/settings/tokens). Con un
      # token de cuenta normal esto resuelve bien — por eso no queda acá
      # ningún paso de debug permanente.
      - name: Alias a la URL fija de staging
        run: |
          host="${{ steps.deploy.outputs.url }}"
          host="${host#https://}"
          npx vercel@latest alias set "$host" proyec-to-staging.vercel.app --scope "${{ secrets.VERCEL_ORG_ID }}" --token="${{ secrets.VERCEL_TOKEN }}"

  smoke-staging:
    needs: deploy-front-staging
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      # Supabase ahora exige el header `apikey` hasta para /auth/v1/health
      # (antes respondía sin nada) — sin esto el smoke test fallaba con 401
      # "No API key found in request" aunque el servicio estuviera sano.
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9taWdrZmhpc3piZmJ5bWJ6YXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDA2MTksImV4cCI6MjEwODc3NjYxOX0.QNQvDZKe0KCH1rJcMVv3ijHYN54r4KwxA39CpxjvCc8 # gitleaks:allow — anon key pública, no un secreto real (ver e2e/supabaseTestClient.ts)
    steps:
      # El proyecto tiene SSO Protection habilitado para todo excepto
      # dominios propios — *.vercel.app (incluido este alias) queda atrás
      # de esa pantalla, así que un curl sin más terminaba "pasando" sin
      # haber visto la app real (302 a vercel.com, que curl -f no trata
      # como error). El bypass header es el mecanismo oficial de Vercel
      # para esto (Settings → Deployment Protection → Protection Bypass
      # for Automation); no desactiva la protección para nadie más.
      - name: La app de staging responde
        run: |
          curl -fsS --max-time 15 -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" https://proyec-to-staging.vercel.app/ > /dev/null

      # `run: |` (bloque) y no `run:` en una sola línea: el ": " dentro del
      # header "apikey: $VAR" rompe el parser de YAML si va como escalar
      # plano en la misma línea del `run:` ("mapping values are not allowed
      # here") — esto tiró abajo la corrida completa (ni siquiera arrancó
      # ningún job) hasta que se detectó acá.
      - name: El Supabase de staging responde
        run: |
          curl -fsS --max-time 15 -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" https://omigkfhiszbfbymbzaxr.supabase.co/auth/v1/health > /dev/null

  # RLS + e2e contra la staging recién deployada — a diferencia del job `e2e`
  # de ci.yml (Supabase local efímero por PR, no bloqueante todavía), ESTE sí
  # es bloqueante: si no pasa, deploy-db-prod no arranca. Es la última
  # confirmación antes de pedirle la aprobación a Jose.
  tests-staging:
    needs: smoke-staging
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: https://omigkfhiszbfbymbzaxr.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9taWdrZmhpc3piZmJ5bWJ6YXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDA2MTksImV4cCI6MjEwODc3NjYxOX0.QNQvDZKe0KCH1rJcMVv3ijHYN54r4KwxA39CpxjvCc8 # gitleaks:allow — anon key pública, no un secreto real (ver e2e/supabaseTestClient.ts)
      # Connection string de STAGING (no de prod) — el seed de más abajo
      # hace un INSERT directo a auth.users/auth.identities (no
      # admin.inviteUserByEmail: ver el comentario del propio script, el
      # trigger handle_new_user no llega a ver invited_at con ese camino).
      SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
      RLS_TEST_USER_B_PASSWORD: ${{ secrets.RLS_TEST_USER_B_PASSWORD }}
      # Mismo motivo que en smoke-staging: sin esto, Playwright navega
      # contra la pantalla de SSO de Vercel en vez de la app — leído por
      # playwright.config.ts (extraHTTPHeaders), no hace falta tocar los
      # specs.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Mismo script que usa ci.yml contra el Supabase local de cada PR — acá
      # apunta a staging por las env vars de arriba, no hace falta ningún
      # código distinto. rls-test-a/b ya existen en staging (sembrados a
      # mano al crear el proyecto), esto solo confirma/refresca la password.
      - name: Asegurar usuarios de prueba en staging
        run: node scripts/ci/seed-local-test-users.mjs

      - name: RLS
        run: npm test

      - name: Instalar Playwright (solo Chromium, único browser del config)
        run: npx playwright install --with-deps chromium

      # E2E_BASE_URL le dice a playwright.config.ts que pruebe la deployment
      # real recién publicada en vez de levantar `npm run dev` local — es lo
      # más parecido a lo que un usuario real va a tocar.
      - name: E2E contra la staging recién deployada
        env:
          E2E_BASE_URL: https://proyec-to-staging.vercel.app
        run: npm run test:e2e

  # ─────────────────────────── PRODUCCIÓN ───────────────────────────
  # Todo lo de arriba (staging) tuvo que salir bien primero. `environment:
  # production` es el gate de aprobación manual (el revisor requerido se
  # configura en Settings → Environments → production, no acá — ver
  # docs/DECISIONS.md). Va SOLO en este job, no en deploy-front-prod/
  # smoke-prod: pedirle a Jose que apruebe dos veces el mismo deploy sería
  # fricción sin beneficio — una vez que la migración está aprobada y
  # aplicada, el front que la acompaña sale solo.

  deploy-db-prod:
    needs: tests-staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      # Parche de una sola vez (docs/AUDIT_2026-10-02.md, deuda de migration
      # repair pendiente desde el baseline que reemplazó ~190 migraciones
      # desincronizadas, commit 6ea35d4). El historial de producción todavía
      # tiene versiones viejas que ya no existen en supabase/migrations/ —
      # sin repararlo, "supabase db push" rechaza cualquier migración nueva.
      # `--status reverted` solo borra esas filas de la tabla de tracking
      # (supabase_migrations.schema_migrations), no toca schema ni datos.
      # Jose autorizó este comando explícitamente (ver docs/DECISIONS.md).
      # Sacar este paso en un PR de limpieza apenas se confirme que corrió.
      - name: Reparar historial de migraciones de producción (una sola vez)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration repair --db-url "$SUPABASE_DB_URL" --status reverted 20260406150449 20260406220350 20260408234022 20260409011951 20260409030644 20260411211323 20260411211335 20260414140047 20260416192028 20260416192827 20260416192926 20260417031038 20260417211507 20260418035947 20260418040544 20260418154903 20260420214458 20260420214522 20260423223656 20260424160915 20260425222122 20260425225225 20260429031825 20260429032204 20260429032402 20260430025054 20260430025702 20260430214824 20260430214953 20260501022258 20260505000234 20260505020412 20260505020813 20260505021308 20260505022553 20260505022912 20260505023128 20260506015830 20260506044020 20260506183942 20260506184110 20260506184230 20260506184304 20260506184438 20260508211317 20260511154841 20260512133708 20260513191207 20260518221820 20260519021455 20260519021811 20260519024536 20260519030412 20260519191458 20260519191511 20260519191516 20260519191522 20260519191946 20260519191952 20260519192117 20260519192140 20260519192145 20260519192151 20260519192215 20260519192220 20260519192228 20260519192234 20260519192301 20260519192332 20260519192345 20260519192357 20260519192419 20260519192453 20260519192532 20260519192646 20260519192754 20260519194832 20260519195411 20260519195750 20260519200603 20260520014556 20260520015558 20260520020408 20260520020431 20260520020851 20260520021933 20260520022656 20260520133210 20260521021526 20260521021836 20260521022104 20260521170248 20260521200206 20260522150046 20260522151157 20260522152250 20260528170618 20260601230247 20260630185059 20260710153920 20260710225014 20260716015153 20260716024949 20260716173313 20260716181443 20260717030153 20260717030654 20260717030712 20260717142033 20260717142132 20260810100000 20260810110000 20260810120000 20260810130000 20260915122510 20260915122515 20260915122522 20260915134418 20260916194924 20260916204243 20260916205902 20260917233826 20260918173544 20260919002207 20260919002415 20260923231708 20260930042442 20260930043033 20260930044124 20261001235200 20261001235220 20261001235851 20261002000346 20261002202437 20261002204329 20261002205850 20261002210043 20261006220032 20261006221616 20261009165838 20261009165924 20261011192534 20261011200326 20261011210341 20261011211338

      - name: Aplicar migraciones a producción
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  # El `needs: deploy-db-prod` es la garantía real de orden: este job ni
  # arranca hasta que la migración de arriba terminó (y, por lo tanto, hasta
  # que Jose aprobó el environment `production`) — el front nuevo nunca sale
  # antes que la migración que necesita.
  deploy-front-prod:
    needs: deploy-db-prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: https://pvuaqatdendcgumwktid.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dWFxYXRkZW5kY2d1bXdrdGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODI1NDksImV4cCI6MjA5MDc1ODU0OX0.lXARzBHFr25LgypLiGivFC49FO4Yy6FdZiH4JMSl9lI # gitleaks:allow — anon key pública, no un secreto real (ver e2e/supabaseTestClient.ts)
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Traer la config del proyecto de Vercel (vercel pull)
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build de producción (con las VITE_* de prod de este job)
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # --prod acá SÍ asigna el dominio real de producción directo (a
      # diferencia de staging, no hace falta un alias aparte).
      - name: Deploy a producción
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  smoke-prod:
    needs: deploy-front-prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      # Mismo motivo que en smoke-staging: /auth/v1/health ahora exige apikey.
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dWFxYXRkZW5kY2d1bXdrdGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODI1NDksImV4cCI6MjA5MDc1ODU0OX0.lXARzBHFr25LgypLiGivFC49FO4Yy6FdZiH4JMSl9lI # gitleaks:allow — anon key pública, no un secreto real (ver e2e/supabaseTestClient.ts)
    steps:
      - name: La app de producción responde
        run: curl -fsS --max-time 15 https://proyec-to.vercel.app/ > /dev/null

      # Mismo motivo que arriba en smoke-staging: bloque, no escalar plano.
      - name: El Supabase de producción responde
        run: |
          curl -fsS --max-time 15 -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" https://pvuaqatdendcgumwktid.supabase.co/auth/v1/health > /dev/null
